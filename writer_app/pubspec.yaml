name: pellucid
description: "A local-first Markdown writing app for long-form fiction, with optional Google Drive backup."
publish_to: 'none'
version: 1.1.0+4

environment:
  sdk: ^3.11.4

dependencies:
  battery_plus: ^7.0.0
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  epub_builder: ^0.2.2
  file: ^7.0.1
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_web_auth_2: ^5.0.3
  github: ^9.25.0
  googleapis: 16.0.0
  htmltopdfwidgets: ^2.1.1
  http: 1.6.0
  intl: ^0.20.2
  macos_secure_bookmarks: ^0.2.1
  markdown: ^7.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  printing: ^5.14.3
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  shelf: 1.4.2
  shelf_router: 1.1.4
  sqflite: ^2.4.2+1
  sqflite_common_ffi: ^2.4.0+3
  url_launcher: 6.3.2
  uuid: ^4.5.3
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  archive: ^4.0.9
  flutter_launcher_icons: ^0.13.1
  msix: ^3.18.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon_master.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

# Microsoft Store package. Runbook: project_docs/pellucid/docs/WINDOWS_STORE.md.
# Build on Windows only: `flutter build windows --release --dart-define=...` first (the OAuth
# secrets never go in this file), then `dart run msix:create --store` (Store upload) or plain
# `dart run msix:create --install-certificate false` (self-signed local test build).
# identity_name / publisher / publisher_display_name come from Partner Center →
# the app → Product management → Product identity. They are public (shown in the Store).
msix_config:
  display_name: Pellucid
  publisher_display_name: OverEngineeredHobbies
  identity_name: OverEngineeredHobbies.Pellucid
  publisher: "CN=DC2CEF40-679E-422D-881F-9B5352D05AEB"
  msix_version: 1.1.0.0
  logo_path: windows/msix/pellucid_logo.png
  capabilities: internetClient
  languages: en-us
  store: false  # test build by default; Store package: dart run msix:create --store
  build_windows: false
